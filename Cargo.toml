[package]
  name    = "sumi"
  version = "1.4.0"
  edition = "2024"
  rust-version = "1.87"

[dependencies]
  ahash              = "0.8.12"
  axum               = { version = "0.8.9", features = ["http1", "json", "query", "tokio"], default-features = false }
  butteraugli        = { version = "0.9.3", optional = true }
  bytes              = { version = "1.12.1", default-features = false }
  crossbeam-queue    = { version = "0.3.14", features = ["alloc"], default-features = false }
  fast-ssim2         = { version = "0.9.0", optional = true }
  fontdue            = { version = "0.9.5", default-features = false }
  imgref             = { version = "1.12.3", optional = true }
  itoa               = "1.0.18"
  mimalloc           = "0.1.52"
  rgb                = { version = "0.8.53", optional = true }
  serde              = { version = "1.0.229", features = ["serde_derive"], default-features = false }
  serde_json         = "1.0.154"
  tokio              = { version = "1.54.1", features = ["fs", "rt-multi-thread", "signal"] }
  tracing            = { version = "0.1.44", features = ["attributes"], default-features = false }
  tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], default-features = false }
  webpx              = { version = "0.4.0", features = ["decode", "encode"], default-features = false }

[features]
  default            = []
  butteraugli        = ["dep:butteraugli", "dep:imgref", "dep:rgb"]
  ssimulacra2        = ["dep:fast-ssim2", "dep:rgb"]

[[bin]]
  name = "sumi"
  path = "src/main.rs"

[[bin]]
  name = "butteraugli"
  path = "src/bin/butteraugli.rs"
  required-features = ["butteraugli"]

[[bin]]
  name = "ssimulacra2"
  path = "src/bin/ssimulacra2.rs"
  required-features = ["ssimulacra2"]

[profile.release]
  lto           = "fat"
  opt-level     = 3
  codegen-units = 1
  panic         = "abort"
  strip         = "symbols"  

[profile.dev]
  debug = false
