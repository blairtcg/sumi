[package]
  name    = "sumi"
  version = "1.4.0"
  edition = "2024"
  rust-version = "1.87"

[dependencies]
  ahash              = "0.8.12"
  axum               = { version = "0.8.9", features = ["http1", "json", "query", "tokio"], default-features = false }
  bytes              = { version = "1.12.1", default-features = false }
  crossbeam-queue    = { version = "0.3.13", features = ["alloc"], default-features = false }
  dashmap            = "6.2.1"
  fontdue            = { version = "0.9.3", default-features = false }
  itoa               = "1.0.18"
  mimalloc           = "0.1.52"
  serde              = { version = "1.0.228", features = ["serde_derive"], default-features = false }
  serde_json         = "1.0.151"
  tokio              = { version = "1.53.0", features = ["fs", "rt-multi-thread", "signal"] }
  tracing            = { version = "0.1.44", features = ["attributes"], default-features = false }
  tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], default-features = false }
  webpx              = { version = "0.4.0", features = ["decode", "encode"], default-features = false }

[profile.release]
  lto           = "fat"
  opt-level     = 3
  codegen-units = 1
  panic         = "abort"
  strip         = "symbols"  

[profile.dev]
  debug = false
